<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知晓云测试</title>
  <script src="https://cdn.ifanr.com/js/baas/1.0.0/baas.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .test-section h3 {
      margin-top: 0;
      color: #333;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #45a049;
    }
    .result {
      margin-top: 10px;
      padding: 10px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 4px;
      white-space: pre-wrap;
      font-family: monospace;
    }
    .success {
      border-left: 4px solid #4CAF50;
    }
    .error {
      border-left: 4px solid #f44336;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>知晓云连接测试</h1>
    
    <div class="test-section">
      <h3>1. 初始化测试</h3>
      <button onclick="testInit()">测试初始化</button>
      <div id="init-result" class="result"></div>
    </div>
    
    <div class="test-section">
      <h3>2. 木偶表测试</h3>
      <button onclick="testPuppets()">测试木偶表操作</button>
      <div id="puppets-result" class="result"></div>
    </div>
    
    <div class="test-section">
      <h3>3. 视频表测试</h3>
      <button onclick="testVideos()">测试视频表操作</button>
      <div id="videos-result" class="result"></div>
    </div>
    
    <div class="test-section">
      <h3>4. 传承人表测试</h3>
      <button onclick="testInheritors()">测试传承人表操作</button>
      <div id="inheritors-result" class="result"></div>
    </div>
    
    <div class="test-section">
      <h3>5. DIY素材表测试</h3>
      <button onclick="testDIYMaterials()">测试DIY素材表操作</button>
      <div id="diy-materials-result" class="result"></div>
    </div>
    
    <div class="test-section">
      <h3>6. DIY创作表测试</h3>
      <button onclick="testDIYCreations()">测试DIY创作表操作</button>
      <div id="diy-creations-result" class="result"></div>
    </div>
  </div>
  
  <script>
    // 初始化知晓云
    const clientID = '882623eed0d11697a49c';
    
    function testInit() {
      const resultDiv = document.getElementById('init-result');
      try {
        if (typeof BaaS !== 'undefined') {
          BaaS.init(clientID);
          resultDiv.innerHTML = '初始化成功！';
          resultDiv.className = 'result success';
        } else {
          resultDiv.innerHTML = 'SDK 未加载';
          resultDiv.className = 'result error';
        }
      } catch (error) {
        resultDiv.innerHTML = '初始化失败: ' + error.message;
        resultDiv.className = 'result error';
      }
    }
    
    function testPuppets() {
      const resultDiv = document.getElementById('puppets-result');
      resultDiv.innerHTML = '测试中...';
      
      if (typeof BaaS === 'undefined') {
        resultDiv.innerHTML = 'SDK 未初始化';
        resultDiv.className = 'result error';
        return;
      }
      
      // 测试查询木偶列表
      const Puppet = new BaaS.TableObject('puppets');
      Puppet.find().then(res => {
        resultDiv.innerHTML = '查询成功！\n' + JSON.stringify(res, null, 2);
        resultDiv.className = 'result success';
      }).catch(err => {
        resultDiv.innerHTML = '查询失败: ' + err.message;
        resultDiv.className = 'result error';
      });
    }
    
    function testVideos() {
      const resultDiv = document.getElementById('videos-result');
      resultDiv.innerHTML = '测试中...';
      
      if (typeof BaaS === 'undefined') {
        resultDiv.innerHTML = 'SDK 未初始化';
        resultDiv.className = 'result error';
        return;
      }
      
      // 测试查询视频列表
      const Video = new BaaS.TableObject('videos');
      Video.find().then(res => {
        resultDiv.innerHTML = '查询成功！\n' + JSON.stringify(res, null, 2);
        resultDiv.className = 'result success';
      }).catch(err => {
        resultDiv.innerHTML = '查询失败: ' + err.message;
        resultDiv.className = 'result error';
      });
    }
    
    function testInheritors() {
      const resultDiv = document.getElementById('inheritors-result');
      resultDiv.innerHTML = '测试中...';
      
      if (typeof BaaS === 'undefined') {
        resultDiv.innerHTML = 'SDK 未初始化';
        resultDiv.className = 'result error';
        return;
      }
      
      // 测试查询传承人列表
      const Inheritor = new BaaS.TableObject('inheritors');
      Inheritor.find().then(res => {
        resultDiv.innerHTML = '查询成功！\n' + JSON.stringify(res, null, 2);
        resultDiv.className = 'result success';
      }).catch(err => {
        resultDiv.innerHTML = '查询失败: ' + err.message;
        resultDiv.className = 'result error';
      });
    }
    
    function testDIYMaterials() {
      const resultDiv = document.getElementById('diy-materials-result');
      resultDiv.innerHTML = '测试中...';
      
      if (typeof BaaS === 'undefined') {
        resultDiv.innerHTML = 'SDK 未初始化';
        resultDiv.className = 'result error';
        return;
      }
      
      // 测试查询DIY素材列表
      const DIYMaterial = new BaaS.TableObject('diy_materials');
      DIYMaterial.find().then(res => {
        resultDiv.innerHTML = '查询成功！\n' + JSON.stringify(res, null, 2);
        resultDiv.className = 'result success';
      }).catch(err => {
        resultDiv.innerHTML = '查询失败: ' + err.message;
        resultDiv.className = 'result error';
      });
    }
    
    function testDIYCreations() {
      const resultDiv = document.getElementById('diy-creations-result');
      resultDiv.innerHTML = '测试中...';
      
      if (typeof BaaS === 'undefined') {
        resultDiv.innerHTML = 'SDK 未初始化';
        resultDiv.className = 'result error';
        return;
      }
      
      // 测试查询DIY创作列表
      const DIYCreation = new BaaS.TableObject('diy_creations');
      DIYCreation.find().then(res => {
        resultDiv.innerHTML = '查询成功！\n' + JSON.stringify(res, null, 2);
        resultDiv.className = 'result success';
      }).catch(err => {
        resultDiv.innerHTML = '查询失败: ' + err.message;
        resultDiv.className = 'result error';
      });
    }
    
    // 页面加载时自动测试初始化
    window.onload = function() {
      testInit();
    };
  </script>
</body>
</html>
