<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试 minapp-sdk 连接</title>
  <!-- 引入 Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>测试 minapp-sdk 连接</h1>
    <div id="test-results" class="mt-4"></div>
    <button id="test-connection" class="btn btn-primary mt-4">测试连接</button>
  </div>

  <!-- 引入测试脚本 -->
  <script type="module">
    // 引入 minapp-sdk
    import * as BaaS from './node_modules/minapp-sdk/lib/index.js';

    // 初始化 SDK
    const clientID = '882623eed0d11697a49c';
    BaaS.init(clientID);

    const testResults = document.getElementById('test-results');
    const testConnectionBtn = document.getElementById('test-connection');

    function addResult(message, isError = false) {
      const div = document.createElement('div');
      div.className = `alert ${isError ? 'alert-danger' : 'alert-success'}`;
      div.textContent = message;
      testResults.appendChild(div);
    }

    // 测试连接
    testConnectionBtn.addEventListener('click', async function() {
      testResults.innerHTML = '';
      addResult('开始测试连接...');

      try {
        // 测试初始化是否成功
        addResult('SDK 初始化成功');
        
        // 测试 TableObject 创建
        const Puppet = new BaaS.TableObject('puppets');
        addResult('TableObject 创建成功');
        
        // 测试查询操作
        const res = await Puppet.find();
        addResult('查询操作成功: ' + JSON.stringify(res));
        
        addResult('所有测试通过！');
      } catch (error) {
        addResult('测试失败: ' + error.message, true);
        console.error('测试失败:', error);
      }
    });
  </script>
</body>
</html>
